# Html2Exe Pages 部署：main 更新后自动把 dist/html2exe.html 同步到 gh-pages 分支
# gh-pages 仅含 index.html + .nojekyll，GitHub Pages 从该分支发布
name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 备份产物
        run: cp dist/html2exe.html /tmp/html2exe.html

      - name: 同步到 gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin gh-pages --depth=1 || true
          if git show-ref --verify --quiet refs/remotes/origin/gh-pages; then
            git switch gh-pages
            git rm -rfq . || true
          else
            git switch --orphan gh-pages
            find . -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +
          fi
          cp /tmp/html2exe.html index.html
          touch .nojekyll
          git add -A
          git diff --cached --quiet || git commit -qm "deploy: sync dist from main@${GITHUB_SHA::7}"
          git push origin gh-pages
